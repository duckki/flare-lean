name = "flare"
version = "0.1.0"
defaultTargets = ["Flare"]
lintDriver = "lint"

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "v0.4.5"

[[lean_lib]]
name = "Flare"

[[lean_exe]]
name = "lint"
root = "Lint"
