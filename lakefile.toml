name = "flare"
version = "0.1.0"
defaultTargets = ["Flare"]
lintDriver = "lint"
requiresModuleSystem = true

[leanOptions]
autoImplicit = false
warningAsError = true
linter.extra = true
linter.missingDocs = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "v0.4.6"

[[lean_lib]]
name = "Flare"

[[lean_exe]]
name = "lint"
root = "Lint"
