name: Lean CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # Do not let dependency initialization fetch the whole Mathlib cache.
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          lint: "false"
          test: "false"
          use-mathlib-cache: "false"
          # Old whole-.lake caches would restore unneeded Mathlib artifacts.
          use-github-cache: "false"
      - name: Download required Mathlib cache
        run: |
          df -h .
          # Mathlib's cache reader skips imports between downstream modules;
          # select every library module, not just the public entry point.
          lake exe cache get 'Flare.*' Tests/ProofAudit.lean Tests/PublicAPI.lean Lint.lean
          df -h .
      - name: Check library and tooling
        run: make check
      - name: Install numerical producer build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flex bison libgmp-dev libmpfr-dev libboost-dev ocaml-nox ocaml-findlib libnum-ocaml-dev
      - name: Build pinned numerical producers
        run: |
          python3 scripts/certify_numerics.py setup --tool gappa --out .cache/numerics-generated/ci-tools/gappa
          python3 scripts/certify_numerics.py setup --tool fptaylor --out .cache/numerics-generated/ci-tools/fptaylor \
            --make-arg "ML=ocamlc -custom -I $(ocamlfind query num)" \
            --make-arg "OPT_ML=ocamlopt -I $(ocamlfind query num)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('.cache/numerics-generated/ci-tools').resolve()
          tools = {'gappa': {'executable': str(base/'gappa/install/bin/gappa')},
                   'fptaylor': {'executable': str(base/'fptaylor/source/fptaylor')}}
          (base/'tools.json').write_text(json.dumps({'analysis_tools': tools}) + '\n')
          PY
          echo "FLARE_NUMERICS_ANALYSIS_TOOLS=$PWD/.cache/numerics-generated/ci-tools/tools.json" >> "$GITHUB_ENV"
      - name: Check numerical workflow and rejection controls
        run: make numerics-check
      - name: Retain external producer workflow evidence
        run: >-
          python3 scripts/benchmark_numerics.py
          --case mean_update_gappa --case mean_update_fptaylor
          --tools .cache/numerics-generated/ci-tools/tools.json
          --out .cache/numerics-generated/bench-external-ci
      - name: Check out pinned README demo source
        uses: actions/checkout@v5
        with:
          repository: rlabbe/filterpy
          ref: 3b51149ebcff0401ff1e10bf08ffca7b6bbc4a33
          path: .cache/numerics-generated/filterpy
          persist-credentials: false
      - name: Generate and replay README evidence
        run: |
          python3 scripts/readme_evidence.py generate \
            --filterpy .cache/numerics-generated/filterpy \
            --out .cache/numerics-generated/readme-evidence
          python3 scripts/readme_evidence.py replay \
            --bundle .cache/numerics-generated/readme-evidence \
            --out .cache/numerics-generated/readme-replay
      - name: Retain checked README evidence
        uses: actions/upload-artifact@v4
        with:
          name: readme-evidence
          path: .cache/numerics-generated/readme-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Run maintained numerical benchmarks
        run: make numerics-bench
      - name: Check representative scale cases
        run: >-
          python3 scripts/benchmark_numerics.py --suite scale
          --case array_prediction4
          --case kalman_004 --case kalman_016 --case kalman_048 --case kalman_128
          --case imu_016 --case imu_048
          --case covariance_relative --case covariance_global
          --contract-cache .cache/numerics-generated/ci-contract-cache
          --out .cache/numerics-generated/scale-ci
      - name: Retain compact loop and shared caller replay evidence
        run: >-
          python3 scripts/benchmark_numerics.py --suite scale
          --case counted_smoothing_0001 --case counted_smoothing_1024
          --case shared_smoothing_0032 --case shared_smoothing_0064
          --contract-cache .cache/numerics-generated/ci-contract-cache --replay
          --out .cache/numerics-generated/scale-compact-ci
      - name: Check Rust application proof-bundle configuration
        run: python3 scripts/certify_numerics.py plan --request examples/numerics/imu48/request.json
      - name: Retain numerical benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerics-benchmarks
          path: |
            .cache/numerics-generated/bench-*/
            .cache/numerics-generated/scale-*/
            .cache/numerics-generated/ci-tools/*/installation.json
            .cache/numerics-generated/ci-tools/*/runs/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Report disk space
        if: always()
        run: df -h .
